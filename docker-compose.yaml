version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: local_mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: my_learning_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      # 1. Persists your data locally on your host machine
      - mysql_data:/var/lib/mysql
      # 2. Mounts your SQL scripts to execute automatically on first-run
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

volumes:
  mysql_data:
